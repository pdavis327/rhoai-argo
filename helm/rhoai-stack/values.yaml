installPlanApproval: Manual

rhoaiChannel: "stable-3.5"
rhoaiVersion: "rhods-operator.3.5.1"
kueue: &kueue "Unmanaged"
trainer: &trainer "Managed"
spark: &spark "Removed"

operatorReplicas: 1
dashboardReplicas: 1

dataScienceCluster:
  create: true

  components:
    sparkoperator:
      managementState: *spark
    kserve:
      managementState: Managed
      modelsAsService:
        managementState: Managed
      nim:
        managementState: Managed
      rawDeploymentServiceConfig: Headless
    aigateway:
      managementState: Managed
      modelsAsAService:
        managementState: Managed
    modelregistry:
      managementState: Managed
      registriesNamespace: rhoai-model-registries
    feastoperator:
      managementState: Managed
    trustyai:
      managementState: Managed
      mcpGuardrailsMode: false
      eval:
        lmeval:
          permitOnline: allow
          permitCodeExecution: allow
    aipipelines:
      managementState: Managed
      argoWorkflowsControllers:
        managementState: Managed
    ray:
      managementState: Managed
    kueue:
      autoCreateQueues: false
      defaultClusterQueueName: default
      defaultLocalQueueName: default
      managementState: *kueue
    workbenches:
      managementState: Managed
      workbenchNamespace: rhods-notebooks
    dashboard:
      managementState: Managed
    mlflowoperator:
      managementState: Managed
    mcplifecycleoperator:
      managementState: Managed
    ogx:
      managementState: Managed
    trainer:
      managementState: *trainer
    trainingoperator:
      managementState: Managed
    llamastackoperator:
      managementState: Managed

userGroups:
  - system:authenticated

dashboardConfig:
  agentConfigManagement: true
  agentOps: true
  agentsCatalog: true
  aiAssetCustomEndpoints: true
  automl: true
  autorag: true
  connectionTest: true
  deploymentWizardYAMLViewer: true
  enablement: true
  externalModels: true
  externalVectorStores: true
  featureStoreAdmin: true
  genAiStudio: true
  genAiTracing: true
  globalProjectPrompts: true
  gpuaas: true
  guardrails: true
  llmGatewayField: true
  llmdTemplates: true
  mcpCatalog: true
  mcpRegistry: true
  modelAsService: true
  observabilityDashboard: true
  projectRBAC: true
  promptManagement: true
  roleManagement: true
  toolCalling: true
  trainingJobs: true
  vLLMDeploymentOnMaaS: true

defaultWorkbenchPvcSize: 20Gi
showJupyterInEnabledApplications: true

modelServerSizes:
  - name: Small
    resources:
      limits:
        cpu: "2"
        memory: 8Gi
      requests:
        cpu: "1"
        memory: 4Gi
  - name: Medium
    resources:
      limits:
        cpu: "8"
        memory: 10Gi
      requests:
        cpu: "4"
        memory: 8Gi
  - name: Large
    resources:
      limits:
        cpu: "10"
        memory: 20Gi
      requests:
        cpu: "6"
        memory: 16Gi

notebookSizes:
  - name: Small
    resources:
      limits:
        cpu: "2"
        memory: 8Gi
      requests:
        cpu: "1"
        memory: 8Gi
  - name: Medium
    resources:
      limits:
        cpu: "6"
        memory: 24Gi
      requests:
        cpu: "3"
        memory: 24Gi
  - name: Large
    resources:
      limits:
        cpu: "14"
        memory: 56Gi
      requests:
        cpu: "7"
        memory: 56Gi
  - name: X Large
    resources:
      limits:
        cpu: "30"
        memory: 120Gi
      requests:
        cpu: "15"
        memory: 120Gi
