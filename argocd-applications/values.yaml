installPlanApproval: &installPlanApproval Manual
kueue: &kueue "Unmanaged"
trainer: &trainer "Managed"
spark: &spark "Removed"

enableGpuApp: true
enableInfrastructureApp: true
enableObservabilityApp: true
enableRhoaiApp: true
enableWorkloadScalingApp: true

configuration:
  gpuApp:
    installPlanApproval: Automatic
    enableRdma: false
    nvidiaGpuChannel: "v25.3"
    nvidiaGpuVersion: 'gpu-operator-certified.v25.3.0'
    nvidiaGpuDriverVersion: 575.57.08

  infrastructureApp:
    installPlanApproval: *installPlanApproval

  ObservabilityApp:
    installPlanApproval: *installPlanApproval

  # DataScienceCluster and dashboard flags live in helm/rhoai-stack/values.yaml.
  # Put deltas here only if this cluster must override the chart.
  RhoaiApp: {}

  WorkloadScalingApp:
    installPlanApproval: *installPlanApproval
    kueue: *kueue
    trainer: *trainer
